<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{layout :: page('deliveries', 'Deliveries',
        'Every notification the connector attempted for this tenant.', ~{::actions}, ~{::content})}">
<body>
<div th:fragment="actions">
  <a th:href="@{/webhooks}" class="button quiet">Webhooks</a>
</div>
<div th:fragment="content">

  <div class="card tight">
    <div th:if="${exchange.successful() and !deliveries.empty()}" class="wrap">
      <table>
        <thead><tr><th>Event</th><th>Subscription</th><th>Status</th><th>Attempts</th><th>Created</th><th></th></tr></thead>
        <tbody>
        <tr th:each="delivery : ${deliveries.items()}">
          <td th:text="${delivery.eventType()}">event</td>
          <td class="id"><code th:text="${delivery.subscriptionId()}">subscription</code></td>
          <td><span th:replace="~{fragments :: badge(${delivery.status()})}"></span></td>
          <td th:text="${delivery.attempts().size()}">0</td>
          <td class="id" th:text="${delivery.createdAt()}">when</td>
          <td class="right">
            <a class="button quiet small"
               th:href="@{'/webhook-deliveries/' + ${delivery.deliveryId()}}">Open</a>
          </td>
        </tr>
        </tbody>
      </table>
      <div th:replace="~{fragments :: pager('/webhook-deliveries', ${nextCursor})}"></div>
    </div>
    <div th:if="${exchange.successful() and deliveries.empty()}" class="empty">
      <strong>No deliveries</strong>
      <span>A delivery appears once an active subscription has an event to receive.</span>
    </div>
    <div th:unless="${exchange.successful()}">
      <div th:replace="~{fragments :: refused(${exchange}, 'the delivery list')}"></div>
    </div>
  </div>

  <div class="card">
    <h2>Filter</h2>
    <form th:action="@{/webhook-deliveries}" method="get" class="row">
      <div class="field">
        <label for="subscriptionId">Subscription id</label>
        <input id="subscriptionId" name="subscriptionId" th:value="${subscriptionId}"
               placeholder="leave empty for all subscriptions">
      </div>
      <div class="field" style="flex:0 0 auto;align-self:end">
        <button type="submit" class="quiet">Apply</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h2>Open by id</h2>
    <form th:action="@{/webhook-deliveries/open}" method="get" class="row">
      <div class="field">
        <label for="deliveryId">Delivery id</label>
        <input id="deliveryId" name="deliveryId" required>
      </div>
      <div class="field" style="flex:0 0 auto;align-self:end">
        <button type="submit" class="quiet">Open</button>
      </div>
    </form>
  </div>

</div>
</body>
</html>
