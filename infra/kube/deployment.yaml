apiVersion: apps/v1
kind: Deployment
metadata:
  name: docnaut-france-integration-tool-java
  labels:
    app.kubernetes.io/name: docnaut-france-integration-tool-java
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: docnaut-france-integration-tool-java
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docnaut-france-integration-tool-java
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: test-tool
          image: ghcr.io/eaglessoft/docnaut-france-integration-tool-java:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DOCNAUT_SANDBOX_API_BASE_URL
              value: https://france-staging.docnaut.com/client/api/v1/
            - name: DOCNAUT_SANDBOX_TOKEN_URL
              value: https://france.docnaut.com/sso/realms/docnaut/protocol/openid-connect/token
            - name: DOCNAUT_PRODUCTION_API_BASE_URL
              value: https://france.docnaut.com/client/api/v1/
            - name: DOCNAUT_PRODUCTION_TOKEN_URL
              value: https://france.docnaut.com/sso/realms/docnaut/protocol/openid-connect/token
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /login
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /login
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /login
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 20
            timeoutSeconds: 3
